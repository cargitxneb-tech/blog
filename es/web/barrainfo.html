<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MiBlog - Navegación Moderna</title>

  <!-- Fuente -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Enlace a CSS externo -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="anuncio">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8980056699793558"
     crossorigin="anonymous"></script>
     <!-- baner 1 -->
     <ins class="adsbygoogle"
     style="display:block"
     data-ad-client="ca-pub-8980056699793558"
     data-ad-slot="8577461929"
     data-ad-format="auto"
     data-full-width-responsive="true"></ins>
     <script>
       (adsbygoogle = window.adsbygoogle || []).push({});
     </script>
  </div>

  <div id="miHeaderNav">
    <header class="header">
      <div class="brand" translate="no">CNEBX BLOG</div>

      <ul class="navlinks" aria-label="Menú principal">
        <li>
          <button type="button">Inicio 
            <svg class="chevron" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="submenu">
            <a href="#">Últimas noticias</a>
            <a href="#">Recomendados</a>
            <a href="#">Destacados</a>
          </div>
        </li>
        <li>
          <button type="button">Servicios 
            <svg class="chevron" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="submenu">
            <a href="#">Diseño Web</a>
            <a href="#">Marketing Digital</a>
            <a href="#">Consultoría</a>
          </div>
        </li>
        <li>
          <button type="button">Idiomas 
            <svg class="chevron" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="submenu">
            <a href="#"><img class="flag" src="https://flagcdn.com/w20/es.png" alt="Español"> Español</a>
            <a href="#"><img class="flag" src="https://flagcdn.com/w20/gb.png" alt="Inglés"> Inglés</a>
          </div>
        </li>
      </ul>

      <div class="actions">
        <button id="menuBtn" class="hamburger" aria-controls="menuList" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>

    <div id="overlay" class="overlay"></div>

    <nav id="menuList">
      <ul>
        <li>
          <button type="button" class="mobile-toggle">Inicio 
            <svg class="chevron" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="mobile-submenu">
            <a href="#">Últimas noticias</a>
            <a href="#">Recomendados</a>
            <a href="#">Destacados</a>
          </div>
        </li>
        <li>
          <button type="button" class="mobile-toggle">Servicios 
            <svg class="chevron" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="mobile-submenu">
            <a href="#">Diseño Web</a>
            <a href="#">Marketing Digital</a>
            <a href="#">Consultoría</a>
          </div>
        </li>
        <li>
          <button type="button" class="mobile-toggle">Idiomas 
            <svg class="chevron" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="mobile-submenu">
            <a href="#"><img class="flag" src="https://flagcdn.com/w20/es.png" alt="Español"> Español</a>
            <a href="#"><img class="flag" src="https://flagcdn.com/w20/gb.png" alt="Inglés"> Inglés</a>
          </div>
        </li>
      </ul>
    </nav>
  </div>

  <!-- Enlace al JS externo -->
  <script src="script.js"></script>

</body>
</html>
